# TTY
# set -g default-terminal "linux"
# set -ga terminal-overrides ",linux:colors=16"

# basics 
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc:RGB"
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g mouse on
set -g set-clipboard on
set -g focus-events on
set -sg escape-time 0

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# split windows (same pane)
unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# vim style pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# reload config
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message " config reloaded"
set -g display-time 1500    

# alt+hjkl to switch (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# renumber tabs
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ctrl a c to close to windows - and tab to make new tabs
bind Tab new-window -c "#{pane_current_path}"
bind c confirm-before -p "kill-pane? (y/n)" kill-pane
bind x confirm-before -p "kill-window? (y/n)" kill-window

# alt+num to go to window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# vim style copying
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane
set -g mode-style "bg=#2e2e2e,fg=#ffffff"

##############################################################################
#                                   statusline                               #
##############################################################################

# status bar

# toggle status bar
bind -n M-s set-option -g status
set -g status-position bottom
set -g status-style "bg=#141413,fg=#abb2bf"
set -g status-left-length 20
set -g status-right-length 40
set -g message-style "bg=#141413,fg=#98c379"        

# session name and dir
set -g status-left "#[fg=#98c379,bold] #S #[fg=#abb2bf]│ "
set -g status-right "#[fg=#5c6370] #{s|$HOME|~|:pane_current_path} "

# windows
set -g window-status-format "#[fg=#5c6370] #I:#W "
set -g window-status-current-format "#[fg=#98c379,bold] #I:#W "
set -g window-status-separator ""

# bind -n M-f if-shell '[ "$(tmux display-message -p "#{session_name}")" = "popup" ]' \
#   'detach-client' \
#   'display-popup -E -w 70% -h 70% -d "#{pane_current_path}" "tmux new-session -A -s popup"'

bind -n M-f if-shell '[ "$(tmux display-message -p "#{session_name}")" = "popup" ]' \
  'detach-client' \
  'display-popup -E -w 70% -h 70% -d "#{pane_current_path}" -e TERM=xterm-kitty "tmux new-session -A -s popup"'

