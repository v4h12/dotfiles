# themes
#include GruvBox_DarkHard.conf
#include Wryan.conf
#include VSCode_Dark.conf

# open hyperlinks in the same terminal
map ctrl+shift+e kitten hints --type path --program @

window_border_width 0px
draw_minimal_borders no 

# terminal opacity and blur
# background_opacity 1.0
background_opacity 0.92
# background_opacity 0.96
# background_blur 1

# advance
term xterm-kitty
allow_remote_control yes
listen_on unix:/tmp/kitty

# terminal bell
enable_audio_bell no

# clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

# os specific tweaks (Gnome window decoration for wayland)
linux_display_server wayland
confirm_os_window_close 0
allow_remote_control yes

# cursor customization
# block / beam / underline
font_size 10.0
cursor_shape beam
cursor_blink_interval 2
cursor_stop_blinking_after 0
shell_integration no-cursor
cursor_trail 1

# scrollback
scrollback_lines 5000
wheel_scroll_multiplier 3.0

# mouse
mouse_hide_wait -1

# window layout
remember_window_size  no
initial_window_width  1200
initial_window_height 750
window_border_width 0.0pt
enabled_layouts tall
window_padding_width 0
window_margin_width 0
hide_window_decorations no

# window management
map ctrl+shift+enter new_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# layout management
map ctrl+shift+l next_layout
map ctrl+alt+r goto_layout tall
map ctrl+alt+s goto_layout stack

# tab bar customization
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
tab_bar_align left
active_tab_font_style   bold
inactive_tab_font_style normal

# tab management
map ctrl+shift+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+q close_tab

# font_family      family='JetBrainsMonoNL Nerd Font Mono' style=Thin

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMonoNL Nerd Font Mono' style=Thin
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

map ctrl+shift+minus change_font_size current -1.0
map ctrl+shift+equal change_font_size current +1.0

# BEGIN_KITTY_THEME
# Kanagawa_dragon
#include current-theme.conf
include Doom-Vibrant.conf
#include Github-Dark.conf
# END_KITTY_THEME


