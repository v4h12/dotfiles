workspace = r[1-4], layout:dwindle
workspace = r[5-8], layout:scroll

scrolling {
    column_width = 0.5               # 2 columns visible by default
    fullscreen_on_one_column = true  # lone window goes full screen
    follow_focus = true              # viewport follows your focus
    follow_min_visible = 0.4         # scroll if less than 40% visible
    focus_fit_method = 1             # fit column to screen edge
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
}
