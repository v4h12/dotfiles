###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, A, exec, kitty -1
# bind = $mainMOd SHIFT, A, exec, kitty -1 --class kitty-float
bind = $mainMod ALT, A, exec, foot
bind = $mainMod, Q, killactive
bind = $mainMod, M, exec, mailspring
bind = $mainMod, n, exec, networkmanager_dmenu
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, ~/.config/hypr/scripts/toggle-rofi.sh
bind = $mainMod SHIFT, R, exec, ~/.config/rofi/wallpaper-switcher.sh
bind = $mainMod, O, exec, obsidian
bind = $mainMod, F, exec, kitty -e yazi
bind = $mainMod SHIFT, F, exec, thunar
bind = $mainMod, W, exec, firefox
bind = $mainMod SHIFT, W, exec, qutebrowser
bind = $mainMod, P, pseudo
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/toggle-gaps.sh
bind = $mainMod ALT, P, pin
bind = $mainMod ALT, J, togglesplit
bind = $mainMod, Z, exec, ~/.config/rofi/hyprland.sh
bind = $mainMod, T, exec, ~/.config/hypr/scripts/toggle-waybar.sh
bind = $mainMod SHIFT, T, exec, ~/.config/rofi/waybar-switcher.sh
bind = $mainMod, X, exec, kitty -e nvim
bind = $mainMod, Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && notify-send "Screenshot saved"
bind = $mainMod SHIFT, PRINT, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && swappy -f ~/Pictures/Screenshots/$(ls -t ~/Pictures/Screenshots | head -n1)
bind = $mainMod, escape, exit
bind = $mainMod SHIFT, n, exec, swaync-client -t -sw
bind = $mainMod SHIFT, escape, exec, hyprlock
# screenshot to text tool
$OCR4Linux = ~/.config/OCR4Linux/OCR4Linux.sh
bind = $mainMod ALT, PRINT, exec, $OCR4Linux --lang eng

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# bind = $mainMod ALT, h, hyprctl dispatch moveactive -37 -37
# bind = $mainMod ALT, l, movefocus
# bind = $mainMod ALT, k, movefocus
# bind = $mainMod ALT, j, movefocus

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# special workspaces
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic
bind = $mainMod SHIFT, D, movetoworkspacesilent, e+0

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# # Resize windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, exec, hyprctl dispatch resizeactive -30 0
bind = $mainMod SHIFT, right, exec, hyprctl dispatch resizeactive 30 0
bind = $mainMod SHIFT, up, exec, hyprctl dispatch resizeactive 0 -30
bind = $mainMod SHIFT, down, exec, hyprctl dispatch resizeactive 0 30
# bind = $mainMod SHIFT, space, exec, hyprctl dispatch resizeactive 100 25
bind = $mainMod SHIFT, space, exec, hyprctl dispatch resizeactive 75 75 && hyprctl dispatch moveactive -37 -37
# bind = $mainMod ALT, space, exec, hyprctl dispatch resizeactive -100 -25
bind = $mainMod ALT, space, exec, hyprctl dispatch resizeactive -75 -75 && hyprctl dispatch moveactive 37 37

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

