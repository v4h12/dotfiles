##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"

# start kitty faster
 windowrulev2 = workspace special:headless silent, class:HeadlessKitty 

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

#misc
 # workspace = w[tv1], gapsout:0, gapsin:0
 # workspace = f[1], gapsout:0, gapsin:0
 # windowrulev2 = pseudo, class:.*
 windowrulev2 = bordersize 0, floating:0, workspace:w[tv1]
 windowrulev2 = rounding 0, floating:0, workspace:w[tv1]
 windowrulev2 = bordersize 0, floating:0, workspace:f[1]
 windowrulev2 = rounding 0, floating:0, workspace:f[1]
 windowrulev2 = workspace special:headless silent, class:HeadlessKitty
 # windowrulev2 = size 50% 100%, class:^(org.pwmt.zathura)$
 # windowrulev2 = move 50% 0, class:^(org.pwmt.zathura)$

#floats
 windowrule = float,class:^(kitty)$
 # windowrule = float,class:^(foot)$,title:^(foot)$
 windowrule = float,class:^(galculator)$,title:^(galculator)
 windowrule = float,class:^(org.pwmt.zathura)$
 windowrule = float,class:^(Artha\~\The\Open\Thesaurus)$,title:^(Artha\~\The\Open\Thesaurus)
 windowrule = float,class:^(org\.pulseaudio\.pavucontrol)
 windowrule = float,class:^(org\.gnome\.PowerStats)
 windowrule = float,class:^(blueman-manager)
 windowrule = float,class:^(nm-connection-editor)
 # windowrule = float,class:^(org\.kde\.kwrite)$,title:.*KWrite.*

 #opacity
 # windowrulev2 = opacity 0.7 0.7,class:^(foot)$
 # windowrulev2 = opacity 1 1,class:^(foot)$
 windowrulev2 = opacity 1 1,class:^(zen-browser)$
 windowrulev2 = opacity 0.8 0.8,class:^(org\.pulseaudio\.pavucontrol)$
  windowrulev2 = opacity 0.8 0.8,class:^(org\.gnome\.PowerStats)
 windowrulev2 = opacity 0.8 0.8,class:^(blueman-manager)$
 windowrulev2 = opacity 0.8 0.8,class:^(nm-connection-editor)$
 windowrulev2 = opacity 0.7 0.7,class:^(micro)$
 windowrulev2 = opacity 0.7 0.7,class:^(btop)$
 windowrulev2 = opacity 0.7 0.7,class:^(rofi)$

#size
 windowrulev2 = size 500 600, class:^(foot)$, title:^(foot)$
 windowrulev2 = size 500 600, class:^(kitty)$
 windowrulev2 = size 500 600, class:^(Artha\~\The\Open\Thesaurus)$, title:^(Artha\~\The\Open\Thesaurus)$
 windowrulev2 = size 500 600, class:^(org\.pulseaudio\.pavucontrol)$, title:^(org\.pulseaudio\.pavucontrol)$

#location
 windowrulev2 = center, class:^(foot)$, title:^(foot)$
 windowrulev2 = center, class:^(kitty)$

windowrulev2 = opacity 1 override,class:^(com.github.johnfactotum.Foliate)$
windowrulev2 = dimaround 0,class:^(com.github.johnfactotum.Foliate)$
# windowrulev2 = blur enable,class:^(com.github.johnfactotum.Foliate)$
