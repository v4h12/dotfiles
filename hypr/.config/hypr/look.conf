#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
	gaps_in = 3      #3
	gaps_out = 6        #6
	border_size = 1     #1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
	col.active_border = rgba(595959aa)
    # col.active_border = rgba(e3dac9aa) rgba(595959aa) 90deg
	col.inactive_border = rgba(000000aa)


    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 0

    # Change transparency of focused and unfocused windows
    # active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 2

        vibrancy = 0.1696
        # vibrancy = 1
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

 # Ultra-fast bezier curves
     bezier = instant, 0, 0, 1, 1  # Linear, no easing
     bezier = snap, 0.9, 0, 0.1, 1  # Very aggressive curve

     # Global fallback - very short
     animation = global, 1, 1, instant

     # Borders - keep minimal
     animation = border, 1, 2, instant

     # Windows - ultra snappy but smooth
     animation = windows, 1, 2, snap, slide
     animation = windowsIn, 1, 2, snap, popin 95%  # Less dramatic popin
     animation = windowsOut, 1, 1.5, instant, popin 98%

     # Fades - very quick
     animation = fadeIn, 1, 1.5, instant
     animation = fadeOut, 1, 1.5, instant
     animation = fade, 1, 1.5, instant

     # Layers - minimal
     animation = layers, 1, 2, instant
     animation = layersIn, 1, 2, instant, fade
     animation = layersOut, 1, 1.5, instant, fade
     animation = fadeLayersIn, 1, 1.5, instant
     animation = fadeLayersOut, 1, 1.5, instant

     # Workspaces - keep snappy
     animation = workspaces, 1, 2, snap, slide
     animation = workspacesIn, 1, 2, instant, fade
     animation = workspacesOut, 1, 2, instant, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    # no_gaps_when_only = 1
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}




