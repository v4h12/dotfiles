################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto

# Tag whatever isn't in use
monitor=eDP-1,1366x768@60,0x1440,1
monitor=HDMI-A-1,2560x1440@60,0x0,1
# monitor=HDMI-A-1,1920x1080@120,1366x0,1
# monitor=HDMI-A-1,1920x1080@60,1366x0,1

# unscale XWayland
xwayland {
	force_zero_scaling = true
}
