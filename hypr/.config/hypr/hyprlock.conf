# ~/.config/hypr/hyprlock.conf

$font  = Liberation Mono
$beige = rgba(f5f5dc88)
$black = rgba(000000ff)
$dim   = rgba(f5f5dc88)

# ---------------------------------------- #
# General
# ---------------------------------------- #
general {
    hide_cursor         = false
    grace               = 0
    disable_loading_bar = true
    no_fade_in          = true
    no_fade_out         = true
}

# ---------------------------------------- #
# Background — screenshot so wallpaper shows, not solid black
# ---------------------------------------- #
background {
    monitor     =
    path        = screenshot
    blur_passes = 0
    brightness  = 0.6
}

# ---------------------------------------- #
# Outer border shape (sits 4px behind main block)
# ---------------------------------------- #
shape {
    monitor  =
    size     = 868, 468
    rounding = 0
    color    = rgba(f5f5dc66)
    position = 0, 0
    halign   = center
    valign   = center
    zindex   = 0
}

# Main black block
shape {
    monitor  =
    size     = 866, 466
    rounding = 0
    color    = rgba(000000ff)
    position = 0, 0
    halign   = center
    valign   = center
    zindex   = 1
}

# Divider — below clock section
shape {
    monitor  =
    size     = 820, 1
    rounding = 0
    color    = $dim
    position = 0, 155
    halign   = center
    valign   = center
    zindex   = 2
}

# Divider — above power controls
shape {
    monitor  =
    size     = 820, 1
    rounding = 0
    color    = $dim
    position = 0, -178
    halign   = center
    valign   = center
    zindex   = 2
}

# ---------------------------------------- #
# Clock
# ---------------------------------------- #
# label {
#     monitor     =
#     text        = cmd[update:100] date +"%H:%M:%S"
#     color       = $beige
#     font_size   = 24
#     font_family = $font
#     position    = 0, 195
#     halign      = center
#     valign      = center
#     zindex      = 2
# }

label {
    monitor     =
    text        = cmd[update:60000] date +"%A  -  %Y/%m/%d"
    color       = $dim
    font_size   = 12
    font_family = $font
    position    = 0, 195
    halign      = center
    valign      = center
    zindex      = 2
}

# ---------------------------------------- #
# Middle — operator info + input
# ---------------------------------------- #
label {
    monitor     =
    text        = OPERATOR: $USER
    color       = $dim
    font_size   = 12
    font_family = $font
    position    = 0, 60
    halign      = center
    valign      = center
    zindex      = 2
}

label {
    monitor     =
    text        = -- AUTHORIZED PERSONNEL ONLY --
    color       = $dim
    font_size   = 10
    font_family = $font
    position    = 0, 35
    halign      = center
    valign      = center
    zindex      = 2
}

input-field {
    monitor           =
    size              = 640, 28
    outline_thickness = 1
    rounding          = 0

    outer_color       = $beige
    inner_color       = $black
    font_color        = $beige
    font_family       = $font
    font_size         = 12

    dots_size         = 0.4
    dots_spacing      = 0.1
    dots_center       = false        # characters grow left-to-right, not centered
    dots_text_format  = *

    fade_on_empty     = false
    hide_input        = false

    # left-align the placeholder text with pango
    placeholder_text  = <span foreground="##f5f5dc" allow_breaks="false">ENTER AUTHORIZATION CODE: </span>
    check_color       = $beige
    fail_color        = rgba(cc3333ff)
    fail_text         = <span foreground="##cc3333">** UNAUTHORIZED — $ATTEMPTS ATTEMPT(S) **</span>

    position          = 0, 0
    halign            = center
    valign            = center
    zindex            = 3
}
# ---------------------------------------- #
# Power controls — inside block, bottom zone
# ---------------------------------------- #
label {
    monitor     =
    text        = [PWR-OFF]
    color       = $dim
    font_size   = 10
    font_family = $font
    position    = -380, -193
    halign      = center
    valign      = center
    zindex      = 2
    onclick     = shutdown now
}

label {
    monitor     =
    text        = [REBOOT]
    color       = $dim
    font_size   = 10
    font_family = $font
    position    = 380, -193
    halign      = center
    valign      = center
    zindex      = 2
    onclick     = reboot
}
