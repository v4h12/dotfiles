$font = "Liberation Mono"

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
    no_fade_in = true
    no_fade_out = true
}

background {
    monitor =
    color = rgba(000000ff)
}

# Military style input field - no animations
input-field {
    monitor =
    size = 600, 25
    outline_thickness = 1
    dots_size = 0.1
    dots_spacing = 0.15
    dots_center = false
    dots_rounding = 0
    
    outer_color = rgba(f5f5dcff)
    inner_color = rgba(000000ff)
    font_color = rgba(f5f5dcff)
    fade_on_empty = false
    fade_timeout = 0
    
    placeholder_text = <span foreground="##f5f5dc">ENTER AUTHORIZATION CODE: </span>
    hide_input = false
    rounding = 0
    font_family = $font
    font_size = 12
    
    check_color = rgba(f5f5dcff)
    fail_color = rgba(f5f5dcff)
    fail_text = <span foreground="##f5f5dc">** UNAUTHORIZED ACCESS **</span>
    
    position = 0, 0
    halign = center
    valign = center
}

# Military time with milliseconds - top center
label {
    monitor =
    text = cmd[update:100] date +"%H:%M:%S.%3N"
    color = rgba(f5f5dcff)
    font_size = 16
    font_family = $font
    
    position = 0, 50
    halign = center
    valign = top
}

# Date - military format
label {
    monitor =
    text = cmd[update:60000] date +"%Y%m%d"
    color = rgba(f5f5dcff)
    font_size = 14
    font_family = $font
    
    position = 0, 80
    halign = center
    valign = top
}

# System designation - top left
label {
    monitor =
    text = SYS-001 TERMINAL
    color = rgba(f5f5dcff)
    font_size = 11
    font_family = $font
    
    position = 20, 20
    halign = left
    valign = top
}

# Security level - top right
label {
    monitor =
    text = CLEARANCE: RESTRICTED
    color = rgba(f5f5dcff)
    font_size = 11
    font_family = $font
    
    position = -20, 20
    halign = right
    valign = top
}

# User designation
label {
    monitor =
    text = OPERATOR: $USER
    color = rgba(f5f5dcff)
    font_size = 12
    font_family = $font
    
    position = 0, -40
    halign = center
    valign = center
}

# Warning - center bottom
label {
    monitor =
    text = -- AUTHORIZED PERSONNEL ONLY --
    color = rgba(f5f5dcff)
    font_size = 10
    font_family = $font
    
    position = 0, 60
    halign = center
    valign = center
}

# Power controls - bottom corners
label {
    monitor =
    text = [PWR-OFF]
    color = rgba(f5f5dcff)
    font_size = 10
    font_family = $font
    
    position = 30, 30
    halign = left
    valign = bottom
    
    onclick = sudo shutdown -P now
}

label {
    monitor =
    text = [REBOOT]
    color = rgba(f5f5dcff)
    font_size = 10
    font_family = $font
    
    position = -30, 30
    halign = right
    valign = bottom
    
    onclick = reboot
}
