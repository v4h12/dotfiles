#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = /usr/lib/xdg-desktop-portal &
exec-once = /usr/bin/emacs --daemon --init-directory /home/v4h/.config/emacs
exec-once = hyprctl plugin load ~/.config/hyprselect/hyprselect.so
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = udiskie --no-tray &
exec-once = hyprpaper &
exec-once = swaync &
exec-once = hyrpidle -c ~/.config/hypr/hypridle.conf &
exec-once = kitty -class HeadlessKitty -single-instance -listen-on unix:/tmp/kitty-socket tail -f /dev/null
exec-once = ~/.config/rofi/restore-wallpaper.sh
exec-once = ~/.config/hypr/scripts/monitor-gaps.sh &
exec-once = ~/.config/hypr/scripts/autostart.sh
# exec-once = artha
# exec-once = hyprctl plugin load ~/.config/Hyprspace/Hyprspace.so

# Restore last wallpaper - doesnt currently work
# exec-once = bash -c '[ -f ~/.cache/current-wallpaper ] && \
#     { hyprpaper & sleep 0.5; \
#       hyprctl hyprpaper preload "$(cat ~/.cache/current-wallpaper)"; \
#       hyprctl hyprpaper wallpaper ",$(cat ~/.cache/current-wallpaper)"; }'

# Restore last Waybar style
exec-once = bash -c 'STYLE=$(cat ~/.cache/waybar-current-style 2>/dev/null); \
    [ -n "$STYLE" ] && waybar -s "$STYLE" || waybar'
